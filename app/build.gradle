plugins { id 'com.android.application' }

def connectionProperties = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { connectionProperties.load(it) }
}
def apiOrigin = connectionProperties.getProperty('injidong.api.origin', 'https://too-interfaces-tuition-ruled.trycloudflare.com')
def apiToken = connectionProperties.getProperty('injidong.api.token', '')
def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    buildFeatures { buildConfig true }
    namespace 'com.injidong.measurement'
    compileSdk 35
    defaultConfig {
        applicationId 'com.injidong.measurement'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.5.2'
        buildConfigField 'String', 'API_ORIGIN', javaString(apiOrigin)
        buildConfigField 'String', 'API_TOKEN', javaString(apiToken)
    }
}

dependencies {
    // Align transitive Kotlin libraries after removing the unused CameraX dependencies.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    // Optional official RealSense Android wrapper: place a source-built librealsense.aar here.
    if (file('libs/librealsense.aar').exists()) {
        implementation files('libs/librealsense.aar')
        implementation 'androidx.core:core:1.13.1'
    }
}

