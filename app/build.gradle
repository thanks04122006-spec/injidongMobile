plugins { id 'com.android.application' }

android {
    namespace 'com.injidong.measurement'
    compileSdk 35
    defaultConfig {
        applicationId 'com.injidong.measurement'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.4.0'
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    // Optional official RealSense Android wrapper: place a source-built librealsense.aar here.
    if (file('libs/librealsense.aar').exists()) {
        implementation files('libs/librealsense.aar')
        implementation 'androidx.core:core:1.13.1'
    }
}

